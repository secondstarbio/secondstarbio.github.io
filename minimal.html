<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Star Bio</title>
  <meta name="description" content="Second Star Bio">
  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      box-sizing: border-box;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    h1 {
      margin: 0 0 1rem;
      font-weight: 400;
      font-size: clamp(1.5rem, 5vw, 2.75rem);
      letter-spacing: 0.15em;
    }

    h2 {
      margin: 0.5rem 0;
      font-weight: 400;
      font-size: clamp(0.95rem, 2.5vw, 1.25rem);
    }

    #galaxy {
      display: block;
      width: min(100%, 760px);
      aspect-ratio: 16 / 10;
      margin: 0.5rem 0 1.5rem;
    }

    a {
      color: #fff;
      text-underline-offset: 0.2em;
    }

    a:hover, a:focus-visible { color: #bbb; }
  </style>
</head>
<body>
  <h1>Second Star Bio</h1>

  <canvas id="galaxy" aria-hidden="true"></canvas>

  <h2>Accelerating genetic medicine to escape velocity</h2>

  <h2>Get in touch with us: <a href="mailto:hello@secondstar.bio">hello@secondstar.bio</a></h2>

  <script>
    (() => {
      const LETTERS = ['A', 'C', 'U', 'G'];
      const LEVELS = 10;          // brightness levels baked into the glyph atlas
      const STAR_COUNT = 2600;
      const INCLINATION = 0.4;   // vertical squash: the disc is viewed at an angle
      const ARMS = 4;
      const WIND = 5.5;           // how tightly the arms wrap around the core (rad)
      const ARM_SPREAD = 0.2;    // angular width of each arm (rad)
      const ROTATION = 0.08;      // orbital speed of the disc (rad/s)
      const PERSPECTIVE = 0.4;    // glyphs at the far rim are this much smaller, near rim this much larger
      const SIZES = 9;            // glyph sizes baked into the atlas for perspective
      const GLYPH_SIZE = 0.010;   // letter height as a fraction of galaxy width (was ~0.013)
      const MIN_GLYPH_PX = 5;     // floor so letters stay legible on small screens

      const canvas = document.getElementById('galaxy');
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const gauss = () => Math.random() + Math.random() + Math.random() - 1.5;

      // Stars are seeded along spiral arms and orbit the core together, so the
      // arms keep their shape (like the Spore galaxy). Bulge stars orbit faster.
      const radius = new Float32Array(STAR_COUNT);
      const angle = new Float32Array(STAR_COUNT);
      const speed = new Float32Array(STAR_COUNT);
      const sprite = new Uint16Array(STAR_COUNT);

      for (let i = 0; i < STAR_COUNT; i++) {
        let r, th;
        const kind = Math.random();
        if (kind < 0.12) {
          // Central bulge.
          r = Math.abs(gauss()) * 0.12;
          th = Math.random() * Math.PI * 2;
        } else if (kind < 0.3) {
          // Diffuse disc between the arms.
          r = Math.min(1, -Math.log(1 - Math.random() * 0.95) * 0.35);
          th = Math.random() * Math.PI * 2;
        } else {
          // Spiral arms, wider and fainter toward the rim.
          r = 0.08 + Math.pow(Math.random(), 0.9) * 0.92;
          const arm = (Math.random() * ARMS | 0) * (Math.PI * 2 / ARMS);
          th = arm + r * WIND + gauss() * ARM_SPREAD * (0.6 + r);
          r += gauss() * 0.04;
        }
        radius[i] = Math.max(0, r);
        angle[i] = th;
        speed[i] = r < 0.15 ? ROTATION * (1 + (0.15 - r) * 12) : ROTATION;

        const brightness = Math.min(1, (0.3 + Math.random() * 0.7) * (1.05 - 0.6 * r));
        const level = Math.max(0, Math.min(LEVELS - 1, Math.round(brightness * (LEVELS - 1))));
        sprite[i] = (Math.random() * LETTERS.length | 0) * LEVELS + level;
      }

      let width = 0, height = 0, cellW = 0, cellH = 0, atlas = null, glow = null;

      function buildSprites(dpr) {
        const fontPx = Math.max(MIN_GLYPH_PX * dpr, Math.round(width * GLYPH_SIZE));
        ctx.font = `${fontPx}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        const maxPx = fontPx * (1 + PERSPECTIVE);
        cellW = Math.ceil(ctx.measureText('M').width * (1 + PERSPECTIVE)) + 2;
        cellH = Math.ceil(maxPx * 1.2);

        // One row per glyph size (far to near), one column per letter/brightness.
        // Every cell is sized for the largest glyph, so drawing stays a 1:1 copy.
        atlas = document.createElement('canvas');
        atlas.width = cellW * LETTERS.length * LEVELS;
        atlas.height = cellH * SIZES;
        const a = atlas.getContext('2d');
        a.textAlign = 'center';
        a.textBaseline = 'middle';
        for (let sz = 0; sz < SIZES; sz++) {
          const scale = 1 - PERSPECTIVE + 2 * PERSPECTIVE * sz / (SIZES - 1);
          a.font = `${fontPx * scale}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
          LETTERS.forEach((letter, li) => {
            for (let lv = 0; lv < LEVELS; lv++) {
              const alpha = 0.15 + 0.85 * (lv / (LEVELS - 1));
              a.fillStyle = `rgba(255,255,255,${alpha})`;
              a.fillText(letter, (li * LEVELS + lv) * cellW + cellW / 2, sz * cellH + cellH / 2);
            }
          });
        }

        // Soft core glow, pre-rendered once per resize.
        glow = document.createElement('canvas');
        glow.width = width;
        glow.height = height;
        const g = glow.getContext('2d');
        const R = Math.min(width, height) * 0.35;
        const grad = g.createRadialGradient(0, 0, 0, 0, 0, R);
        grad.addColorStop(0, 'rgba(255,255,255,0.15)');
        grad.addColorStop(0.4, 'rgba(255,255,255,0.06)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        g.setTransform(1, 0, 0, INCLINATION, width / 2, height / 2);
        g.fillStyle = grad;
        g.beginPath();
        g.arc(0, 0, R, 0, Math.PI * 2);
        g.fill();
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        width = Math.max(1, Math.round(rect.width * dpr));
        height = Math.max(1, Math.round(rect.height * dpr));
        canvas.width = width;
        canvas.height = height;
        buildSprites(dpr);
        draw(0);
      }

      function draw(dt) {
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(glow, 0, 0);

        const cx = width / 2;
        const cy = height / 2;
        const R = Math.min(width / 2, height / 2 / INCLINATION) * 0.96;
        const halfW = cellW / 2;
        const halfH = cellH / 2;
        const sizeStep = (SIZES - 1) / 2;

        for (let i = 0; i < STAR_COUNT; i++) {
          const th = (angle[i] -= speed[i] * dt);
          const depth = radius[i] * Math.sin(th);   // -1 = far rim, +1 = near rim
          const x = radius[i] * Math.cos(th) * R;
          const y = depth * R * INCLINATION;
          const sz = Math.max(0, Math.min(SIZES - 1, Math.round((depth + 1) * sizeStep)));
          ctx.drawImage(
            atlas, sprite[i] * cellW, sz * cellH, cellW, cellH,
            (cx + x - halfW) | 0, (cy + y - halfH) | 0, cellW, cellH
          );
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        draw(dt);
        requestAnimationFrame(frame);
      }

      new ResizeObserver(resize).observe(canvas);
      resize();
      if (!reduceMotion) requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
